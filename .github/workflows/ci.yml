name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: smoke (headless frame renders)
        if: runner.os != 'Windows'
        run: |
          node bin/tape.js demo /tmp/demo.jsonl
          node bin/tape.js /tmp/demo.jsonl --frame 8 --plain > /dev/null
