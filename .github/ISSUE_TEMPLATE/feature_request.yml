name: 💡 Feature idea
description: A capability that would make this more useful.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does the tool get in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you'd want the interface to look like.
